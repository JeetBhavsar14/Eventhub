<header class="site-header" [class.is-scrolled]="isScrolled()">
  <div class="bar-top">
    <div class="bar-inner">

      <!-- Logo -->
      <a [routerLink]="homeRoute()" class="logo" title="EventHub">
        <img src="assets/images/eventhub-logo.svg" alt="EventHub Logo" class="logo-icon-img" width="34" height="34" />
        <span class="logo-text">EventHub</span>
      </a>

      <!-- Home Button -->
      <a [routerLink]="homeRoute()" 
         class="header-home-btn"
         [class.active]="isHomeSelected()"
         title="Go to Home">
        <span class="header-home-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-house">
            <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
            <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          </svg>
        </span>
        <span class="header-home-text">Home</span>
      </a>

      <!-- City selector Component -->
      <app-header-city-selector
        [selectedCity]="selectedCity()"
        [isOpen]="showCityMenu"
        (citySelected)="onCitySelected($event)"
        (toggleMenu)="toggleCityMenu()"
        (detectLocationRequested)="onDetectLocation()">
      </app-header-city-selector>

      <!-- Search Component with Spotlight Autocomplete -->
      <app-header-search
        [allEvents]="allEvents()"
        [isFocused]="searchFocused()"
        (searchSubmitted)="onSearchSubmitted($event)"
        (eventSelected)="onEventSelected($event)"
        (focusChanged)="onSearchFocusChanged($event)">
      </app-header-search>

      <!-- Right side actions -->
      <div class="header-actions">
        <!-- Guest actions -->
        <ng-container *ngIf="!isAuthenticated()">
          <a routerLink="/auth/login" class="action-link">Login</a>
          <a routerLink="/auth/register" class="action-btn">Sign Up</a>
        </ng-container>

        <!-- Authenticated actions -->
        <ng-container *ngIf="isAuthenticated()">
          <!-- Notification Flyout Component -->
          <app-header-notifications
            [isOpen]="showNotifications()"
            [notifications]="notifications()"
            [unreadCount]="unreadCount()"
            (toggleOpened)="toggleNotifications($event)"
            (notificationClicked)="onNotificationClick($event)"
            (markAllRead)="markAllNotificationsAsRead($event)"
            (acceptInvitation)="acceptInvitation($event)"
            (declineInvitation)="declineInvitation($event)"
            (dismissNotification)="dismissNotification($event)"
            (openWorkspace)="goToWorkspace($event)">
          </app-header-notifications>

          <!-- User Menu Component -->
          <app-header-user-menu
            [isOpen]="showUserMenu"
            [user]="currentUser()"
            [isApprovedHost]="isApprovedHost()"
            [isAdmin]="isAdmin()"
            [isManagement]="isManagement()"
            [isStaff]="isStaff()"
            [hostStatus]="hostStatus()"
            (toggleMenu)="toggleUserMenu()"
            (closeMenu)="closeUserMenu()"
            (logout)="logout()">
          </app-header-user-menu>
        </ng-container>
      </div>
    </div>
  </div>

  <!-- BAR 2 — Category Pills & Secondary Links -->
  <div class="bar-bottom">
    <div class="bar-inner">
      <!-- Category pills (Desktop >= 900px) -->
      <nav class="category-nav">
        <a
          *ngFor="let cat of primaryCategories"
          [routerLink]="['/discover']"
          [queryParams]="{ category: cat.label }"
          class="cat-pill"
          [class.cat-pill--active]="isCategoryActive(cat.label)"
          (click)="onCategoryPillClick(cat, $event)">
          <app-icon [name]="cat.iconName" [size]="16" class="cat-icon"></app-icon>
          {{ cat.label }}
        </a>

        <!-- Others Category Dropdown -->
        <div class="others-dropdown-wrap" (click)="$event.stopPropagation()">
          <button 
            type="button"
            class="cat-pill others-pill"
            [class.cat-pill--active]="isOtherCategoryActive()"
            [class.others-pill--open]="showOthersDropdown()"
            (click)="toggleOthersDropdown($event)"
            title="More Categories"
            aria-haspopup="true"
            [attr.aria-expanded]="showOthersDropdown()">
            <app-icon name="others" [size]="16" class="cat-icon"></app-icon>
            <span>Others</span>
            <svg class="others-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </button>

          <!-- Others Dropdown List -->
          <div class="others-dropdown-menu" *ngIf="showOthersDropdown()">
            <div class="others-dropdown-header">
              <span>More Categories</span>
              <span class="others-count-badge">{{ otherCategories.length }}</span>
            </div>
            <div class="others-dropdown-list">
              <button 
                type="button"
                *ngFor="let otherCat of otherCategories" 
                class="others-dropdown-item" 
                [class.active]="isCategoryActive(otherCat.label)"
                (click)="selectOtherCategory(otherCat, $event)">
                <app-icon [name]="otherCat.iconName" [size]="15" class="others-item-icon"></app-icon>
                <span class="others-item-label">{{ otherCat.label }}</span>
                <svg *ngIf="isCategoryActive(otherCat.label)" class="others-item-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </nav>

      <!-- Category Dropdown List (Smaller screens < 900px) -->
      <div class="category-dropdown-wrap" (click)="$event.stopPropagation()">
        <button class="category-dropdown-btn" (click)="toggleCategoryMenu($event)" [class.active]="showCategoryMenu()">
          <svg class="cat-dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="7" height="7" rx="1.5"/>
            <rect x="14" y="4" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          </svg>
          <span class="cat-dropdown-label">{{ selectedCategory() }}</span>
          <svg class="caret-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <!-- Mobile Dropdown Menu -->
        <div class="category-dropdown-menu" *ngIf="showCategoryMenu()">
          <div class="cat-dropdown-header">Popular Categories</div>
          <button 
            *ngFor="let cat of primaryCategories" 
            class="cat-dropdown-item" 
            [class.active]="isCategoryActive(cat.label)"
            (click)="selectCategory(cat, $event)">
            <app-icon [name]="cat.iconName" [size]="16" class="cat-icon"></app-icon>
            <span>{{ cat.label }}</span>
          </button>
          <div class="cat-dropdown-header">More Categories</div>
          <button 
            *ngFor="let cat of otherCategories" 
            class="cat-dropdown-item" 
            [class.active]="isCategoryActive(cat.label)"
            (click)="selectCategory(cat, $event)">
            <app-icon [name]="cat.iconName" [size]="16" class="cat-icon"></app-icon>
            <span>{{ cat.label }}</span>
          </button>
        </div>
      </div>

      <!-- Secondary links -->
      <nav class="secondary-nav" aria-label="Quick links">
        <a *ngFor="let link of secondaryLinks" 
           [routerLink]="link.route" 
           class="secondary-link"
           routerLinkActive="secondary-link--active">
          <app-icon *ngIf="link.icon" [name]="link.icon" [size]="14" class="secondary-link-icon"></app-icon>
          <span>{{ link.label }}</span>
        </a>
      </nav>
    </div>
  </div>
</header>
