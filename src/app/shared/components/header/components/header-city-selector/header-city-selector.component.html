<div class="city-selector-wrap" (click)="$event.stopPropagation()">
  <button class="city-selector" (click)="onToggle($event)">
    <svg class="city-pin-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="12" cy="9" r="2.5" stroke="currentColor" stroke-width="2"/>
    </svg>
    <span class="city-name">{{ selectedCity }}</span>
    <svg class="caret-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- City Dropdown Menu -->
  <div class="city-dropdown" *ngIf="isOpen">
    <!-- Search & Detect Location -->
    <div class="city-search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <path d="M20 20l-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input 
        type="text" 
        placeholder="Search for your city" 
        [ngModel]="citySearchQuery()" 
        (ngModelChange)="citySearchQuery.set($event)"
        maxlength="50">
    </div>
    
    <button class="detect-location-btn" (click)="onDetectLocation()">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
      </svg>
      Detect my location
    </button>

    <hr class="dropdown-divider">
    
    <!-- Popular Cities -->
    <div class="popular-cities">
      <h6 class="dropdown-subtitle">Popular Cities</h6>
      <div class="cities-grid">
        <button 
          *ngFor="let city of filteredCities" 
          class="city-item-btn" 
          [class.active]="city === selectedCity"
          (click)="onSelectCity(city)">
          {{ city }}
        </button>
      </div>
      <div *ngIf="filteredCities.length === 0" class="no-cities">
        No cities found matching "{{ citySearchQuery() }}"
      </div>
    </div>
  </div>
</div>
