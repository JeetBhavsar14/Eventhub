<form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
  <div class="form-row">
    <app-input formControlName="firstName" label="First Name" placeholder="First Name" [required]="true"></app-input>
    <app-input formControlName="lastName" label="Last Name" placeholder="Last Name" [required]="true"></app-input>
  </div>

  <div class="form-row">
    <app-input type="email" formControlName="email" label="Email Address" placeholder="Email"></app-input>
    <app-input type="tel" formControlName="phone" label="Phone Number" placeholder="Phone"></app-input>
  </div>

  <div class="form-group">
    <label for="bio">Bio</label>
    <textarea id="bio" class="custom-textarea" formControlName="bio" rows="4" placeholder="Tell us a little about yourself..."></textarea>
  </div>

  <div class="form-actions">
    <app-button type="submit" variant="primary" [disabled]="form.invalid || isSaving">
      {{ isSaving ? 'Saving...' : 'Save Changes' }}
    </app-button>
  </div>
</form>
