<div class="admin-platform-shell" [class.sidebar-collapsed]="isSidebarCollapsed()" [class.mobile-open]="isMobileNavOpen()">

  <!-- MOBILE OVERLAY BACKDROP -->
  <div class="admin-backdrop" *ngIf="isMobileNavOpen()" (click)="toggleMobileNav()"></div>

  <!-- 1. LEFT ADMIN SIDEBAR -->
  <app-admin-sidebar
    [currentView]="currentView()"
    [platformStats]="platformStats()"
    [isSidebarCollapsed]="isSidebarCollapsed()"
    [isMobileNavOpen]="isMobileNavOpen()"
    (navigate)="setView($event)"
    (closeMobile)="toggleMobileNav()"
    (signOut)="signOut()">
  </app-admin-sidebar>

  <!-- 2. MAIN ADMIN WRAPPER -->
  <div class="admin-main-wrapper">
    
    <!-- Top Header -->
    <app-admin-header
      [currentView]="currentView()"
      (toggleMobile)="toggleMobileNav()"
      (openBroadcast)="openBroadcastModal()"
      (signOut)="signOut()">
    </app-admin-header>

    <!-- Main Content Area -->
    <main class="admin-content">

      <!-- Toast Feedback -->
      <div class="admin-toast" *ngIf="toastMessage()">
        <app-icon name="check-circle"></app-icon>
        <span>{{ toastMessage() }}</span>
      </div>

      <!-- VIEW 1: DASHBOARD OVERVIEW -->
      <app-admin-overview 
        *ngIf="currentView() === 'overview'"
        [platformStats]="platformStats()"
        (navigate)="setView($event)"
        (inspectApp)="openAppDetailsModal($event)"
        (inspectEvent)="openEventCurationModal($event)">
      </app-admin-overview>

      <!-- VIEW 2: HOST APPLICATIONS QUEUE -->
      <app-admin-host-applications
        *ngIf="currentView() === 'host_applications'"
        (inspectApp)="openAppDetailsModal($event)"
        (approveApp)="promptApproveHostApplication($event.id, $event.name)">
      </app-admin-host-applications>

      <!-- VIEW 3: EVENT CURATION & MODERATION -->
      <app-admin-event-curation
        *ngIf="currentView() === 'event_curation'"
        (inspectEvent)="openEventCurationModal($event)"
        (approveEvent)="promptApproveEventForLive($event.id, $event.title)"
        (delistEvent)="promptDelistEvent($event.id, $event.title)"
        (toggleFeatured)="toggleEventFeatured($event.id, $event.title)">
      </app-admin-event-curation>

      <!-- VIEW 4: USER & HOST DIRECTORY -->
      <app-admin-users
        *ngIf="currentView() === 'users'"
        (inspectUser)="openUserDossier($event)"
        (toggleSuspension)="promptToggleUserSuspension($event)">
      </app-admin-users>

      <!-- VIEW 5: FINANCE & SETTLEMENTS -->
      <app-admin-finance
        *ngIf="currentView() === 'finance'"
        [platformStats]="platformStats()"
        (releasePayout)="promptReleaseSettlementPayout($event)">
      </app-admin-finance>

      <!-- VIEW 6: SYSTEM SETTINGS -->
      <app-admin-settings
        *ngIf="currentView() === 'settings'">
      </app-admin-settings>
    </main>
  </div>

  <!-- MODAL: HOST APPLICATION INSPECTION -->
  <app-admin-host-app-modal
    [app]="selectedAppForModal()"
    (close)="closeAppDetailsModal()"
    (requestClarification)="requestMoreHostInfo($event)"
    (reject)="promptRejectHostApplication($event.id, $event.applicantName)"
    (approve)="promptApproveHostApplication($event.id, $event.applicantName)">
  </app-admin-host-app-modal>

  <!-- MODAL: EVENT CURATION FEEDBACK -->
  <app-admin-event-curation-modal
    [event]="selectedEventForModal()"
    (close)="closeEventCurationModal()"
    (sendFeedback)="sendEventFeedback($event)"
    (approve)="promptApproveEventForLive($event.id, $event.title)">
  </app-admin-event-curation-modal>

  <!-- MODAL: BROADCAST ANNOUNCEMENT -->
  <app-admin-broadcast-modal
    [isOpen]="showBroadcastModal()"
    (close)="closeBroadcastModal()"
    (broadcast)="sendBroadcast($event)">
  </app-admin-broadcast-modal>

  <!-- DRAWER: USER DOSSIER & ROLE REASSIGNMENT -->
  <app-admin-user-dossier-modal
    [user]="selectedUserForDossier()"
    (close)="closeUserDossier()"
    (changeRole)="promptChangeUserRole($event.user, $event.newRole)"
    (toggleSuspension)="promptToggleUserSuspension($event)">
  </app-admin-user-dossier-modal>

  <!-- CONFIRMATION DIALOG MODAL -->
  <app-confirm-dialog
    [show]="showConfirmationDialog()"
    [title]="confirmDialogData.title"
    [message]="confirmDialogData.message"
    [actionBtnText]="confirmDialogData.actionBtnText"
    [isDestructive]="confirmDialogData.isDestructive"
    (confirm)="executeConfirmAction()"
    (cancel)="cancelConfirm()">
  </app-confirm-dialog>

</div>
