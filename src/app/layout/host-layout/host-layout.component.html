<div class="host-workspace-layout" [class.mobile-sidebar-open]="isMobileSidebarOpen()">

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- A. LEFT SIDEBAR (EXTRACTED COMPONENT)                       -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <app-host-sidebar
    [currentView]="currentView()"
    [eventsCount]="events().length"
    [totalBookingsCount]="stats().totalBookings"
    [teamMembersCount]="teamMembers().length"
    [unreadCount]="unreadCount()"
    [hostInfo]="hostInfo()"
    [isMobileSidebarOpen]="isMobileSidebarOpen()"
    (switchView)="switchView($event)"
    (openCreateWizard)="openCreateWizard()"
    (openHelp)="showHelpModal.set(true)"
    (signOut)="signOut()"
    (closeMobileSidebar)="isMobileSidebarOpen.set(false)">
  </app-host-sidebar>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- B. MAIN WRAPPER (Header + View Content)                    -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <div class="workspace-main-wrapper">

    <!-- TOP HEADER (EXTRACTED COMPONENT) -->
    <app-host-header
      [currentView]="currentView()"
      [events]="events()"
      [notifications]="notifications()"
      [unreadCount]="unreadCount()"
      [hostInfo]="hostInfo()"
      (toggleMobileSidebar)="toggleMobileSidebar()"
      (switchView)="switchView($event)"
      (openHelp)="showHelpModal.set(true)"
      (selectEvent)="openEventDetails($event)"
      (markNotificationRead)="dashboardService.markNotificationRead($event)"
      (markAllNotificationsRead)="markAllNotificationsRead()"
      (signOut)="signOut()">
    </app-host-header>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- C. MAIN CONTENT BODY AREA                                  -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <main class="workspace-main-content">

      <!-- TOAST NOTIFICATION (Interactive Feedback) -->
      <div class="dashboard-toast" *ngIf="toastMessage()">
        <app-icon name="check-circle"></app-icon>
        <span>{{ toastMessage() }}</span>
      </div>

      <!-- MAIN DASHBOARD VIEW: OVERVIEW (EXTRACTED COMPONENT) -->
      <div class="dashboard-error-banner" *ngIf="dashboardService.error()"
        style="background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem;">
        <span>{{ dashboardService.error() }}</span>
      </div>

      <app-host-overview *ngIf="currentView() === 'overview'" [hostInfo]="hostInfo()" [stats]="stats()"
        [selectedPeriod]="selectedPeriod()" [chartData]="chartData()" [events]="events()"
        [upcomingEvents]="upcomingEvents()" [pendingActions]="pendingActions()" [recentActivities]="recentActivities()"
        (createEvent)="openCreateWizard()" (periodChange)="setPeriod($event)" (viewAllEvents)="switchView('my_events')"
        (openDetails)="openEventDetails($event.event, $event.editMode)" (submitForReview)="submitDraftForReview($event)"
        (publishEvent)="publishApprovedEvent($event)" (reviewFeedback)="openFeedbackModal($event)"
        (deleteDraft)="deleteDraftEvent($event)" (navigateView)="switchView($event)" (toast)="showToast($event)">
      </app-host-overview>

      <!-- SUB-VIEW 2: MY EVENTS FULL VIEW (EXTRACTED COMPONENT) -->
      <app-host-my-events *ngIf="currentView() === 'my_events'" [events]="filteredEvents()"
        (viewDetails)="openEventDetails($event)" (createEvent)="openCreateWizard()"
        (submitForReview)="submitDraftForReview($event)" (publishEvent)="publishApprovedEvent($event)"
        (reviewFeedback)="openFeedbackModal($event)">
      </app-host-my-events>

      <!-- SUB-VIEW 3: BOOKINGS & ATTENDEES VIEW (EXTRACTED COMPONENT) -->
      <app-host-bookings *ngIf="currentView() === 'bookings'" [attendees]="attendees()"
        (exportCsv)="showToast('Exported attendee roster to CSV')">
      </app-host-bookings>

      <!-- SUB-VIEW 4: TEAM MANAGEMENT VIEW (EXTRACTED COMPONENT) -->
      <app-host-team *ngIf="currentView() === 'team'" [ownerStakes]="ownerStakes()" [isEquityValid]="isEquityValid()"
        [totalAllocatedEquity]="totalAllocatedEquity()" [remainingEquityPool]="remainingEquityPool()"
        [eventManagers]="eventManagers()" [operationalTeam]="operationalTeam()"
        [eventParticipants]="eventParticipants()" [pendingInvitations]="pendingInvitations()"
        [primaryOwner]="primaryOwner()" (addOwner)="openAddOwnerModal()" (assignManager)="openAssignManagerModal()"
        (inviteTeam)="openInviteTeamModal()" (addParticipant)="openAddParticipantModal($event)"
        (updateStake)="updateStake($event.stakeId, $event.percentage)" (removeStake)="removeOwnerStake($event)"
        (toggleManagerDelegation)="toggleMgrDelegation($event)" (removeManager)="removeManagerAssignment($event)"
        (removeStaffMember)="removeMember($event.memberId, $event.memberName)"
        (removeParticipant)="removeParticipantItem($event)">
      </app-host-team>

      <!-- SUB-VIEW 5: ANALYTICS VIEW (EXTRACTED COMPONENT) -->
      <app-host-analytics *ngIf="currentView() === 'analytics'">
      </app-host-analytics>

      <!-- SUB-VIEW 6: NOTIFICATIONS CENTER VIEW (EXTRACTED COMPONENT) -->
      <app-host-notifications *ngIf="currentView() === 'notifications'" [notifications]="notifications()"
        [unreadCount]="unreadCount()" (markAllRead)="markAllNotificationsRead()">
      </app-host-notifications>

      <!-- SUB-VIEW 7: SETTINGS VIEW (EXTRACTED COMPONENT) -->
      <app-host-settings *ngIf="currentView() === 'settings'" [hostInfo]="hostInfo()">
      </app-host-settings>

    </main>
  </div>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- MODALS & DRAWERS                                            -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- MODAL 1: CREATE EVENT WIZARD (4 Steps) -->
  <app-create-event-wizard
    *ngIf="showCreateEventModal()"
    (close)="showCreateEventModal.set(false)"
    (finish)="finishCreateEventFromWizard($event)">
  </app-create-event-wizard>

  <!-- MODAL 2: EVENT DETAILS DRAWER (VIEW & EDIT WITH ADMIN CHANGE REQUEST) -->
  <app-event-details-drawer
    *ngIf="selectedEventForDetails()"
    [event]="selectedEventForDetails()!"
    (close)="selectedEventForDetails.set(null)"
    (submitDraft)="submitDraftForReview($event); selectedEventForDetails.set(null)"
    (publishApproved)="publishApprovedEvent($event); selectedEventForDetails.set(null)"
    (saveChanges)="saveDrawerEventChanges($event)">
  </app-event-details-drawer>

  <!-- MODAL 3: FEEDBACK REVIEW & CLARIFICATION -->
  <app-event-feedback-modal
    *ngIf="selectedEventForFeedback()"
    [event]="selectedEventForFeedback()!"
    (close)="selectedEventForFeedback.set(null)"
    (submitResponse)="handleFeedbackResubmit($event)">
  </app-event-feedback-modal>

  <!-- MODAL 4: INVITE TEAM MEMBER OR PARTICIPANT (§ 5.2) -->
  <app-team-invite-modal
    *ngIf="showInviteTeamModal()"
    (close)="showInviteTeamModal.set(false)">
  </app-team-invite-modal>

  <!-- MODAL 5: HELP & DOCUMENTATION -->
  <app-host-help-modal
    *ngIf="showHelpModal()"
    (close)="showHelpModal.set(false)">
  </app-host-help-modal>

  <!-- MODAL 6: ADD CO-OWNER MODAL (§ 11.0) -->
  <app-add-co-owner-modal
    *ngIf="showAddOwnerModal()"
    [availableEquity]="availableCoOwnerEquity()"
    (close)="showAddOwnerModal.set(false)">
  </app-add-co-owner-modal>

  <!-- MODAL 7: ASSIGN EVENT MANAGER MODAL (§ 12.0) -->
  <app-assign-manager-modal
    *ngIf="showAssignManagerModal()"
    (close)="showAssignManagerModal.set(false)">
  </app-assign-manager-modal>

  <!-- MODAL 8: ADD PARTICIPANT (Speaker / Artist / Sponsor) § 14.0 -->
  <app-add-participant-modal
    *ngIf="showAddParticipantModal()"
    [initialCategory]="newParticipantForm.category"
    (close)="showAddParticipantModal.set(false)">
  </app-add-participant-modal>

  <!-- Reusable Confirmation Dialog Modal -->
  <app-confirm-dialog [show]="showConfirmDialog()" [title]="confirmDialogData().title"
    [message]="confirmDialogData().message" [actionBtnText]="confirmDialogData().actionBtnText"
    [isDestructive]="confirmDialogData().isDestructive" (confirm)="executeConfirm()" (cancel)="cancelConfirm()">
  </app-confirm-dialog>

</div>
